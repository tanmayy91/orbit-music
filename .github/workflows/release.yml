name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0). Leave empty to use version from v.json."
        required: false
        default: ""
      prerelease:
        description: "Mark release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(python3 -c 'import json; print(json.load(open("v.json"))["version"].strip().lstrip("vV"))')"
            if [ -z "$VERSION" ]; then
              echo "Could not determine version from v.json" >&2
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare signing keystores
        env:
          ORBIT_MUSIC_KEYSTORE_BASE64: ${{ secrets.ORBIT_MUSIC_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_MUSIC_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ORBIT_MUSIC_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ORBIT_MUSIC_KEY_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$ORBIT_MUSIC_KEYSTORE_BASE64" ]; then
            echo "$ORBIT_MUSIC_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.keystore
            echo "ORBIT_MUSIC_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "ORBIT_MUSIC_KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "ORBIT_MUSIC_KEY_ALIAS=${SECRET_KEY_ALIAS:-orbitmusic}" >> "$GITHUB_ENV"
            echo "ORBIT_MUSIC_KEY_PASSWORD=${SECRET_KEY_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "signing_mode=release-secret" >> "$GITHUB_ENV"
          else
            echo "ORBIT_MUSIC_KEYSTORE_FILE=${{ github.workspace }}/debug.keystore" >> "$GITHUB_ENV"
            echo "ORBIT_MUSIC_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ORBIT_MUSIC_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ORBIT_MUSIC_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "signing_mode=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :core:model:test :ytmusic:test :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Package release APK & prepare release notes
        id: pkg
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          ASSET_NAME="Orbit-Music-${TAG}.apk"
          cp "$APK_PATH" "dist/${ASSET_NAME}"
          (cd dist && sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256")
          SHA256="$(cut -d ' ' -f 1 "dist/${ASSET_NAME}.sha256")"
          SIZE_BYTES="$(wc -c < "dist/${ASSET_NAME}")"
          SIZE_MB="$(awk "BEGIN { printf \"%.1f MB\", ${SIZE_BYTES} / 1048576 }")"

          NOTES_FILE="docs/releases/${TAG}.md"
          BODY_FILE="dist/release-notes.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$BODY_FILE"
          else
            printf '**Orbit Music %s** built automatically by GitHub Actions.\n' "${TAG#v}" > "$BODY_FILE"
          fi

          {
            printf '\n---\n'
            printf -- '- **APK:** `%s` (%s)\n' "${ASSET_NAME}" "${SIZE_MB}"
            printf -- '- **SHA-256:** `%s`\n' "${SHA256}"
            printf -- '- **Signing:** %s\n' "${signing_mode}"
          } >> "$BODY_FILE"

          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset_name }}
          path: |
            dist/${{ steps.pkg.outputs.asset_name }}
            dist/${{ steps.pkg.outputs.asset_name }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Orbit Music ${{ steps.meta.outputs.tag }}
          body_path: dist/release-notes.md
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/${{ steps.pkg.outputs.asset_name }}
            dist/${{ steps.pkg.outputs.asset_name }}.sha256
