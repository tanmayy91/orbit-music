name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0). Leave empty to use version from v.json."
        required: false
        default: ""
      prerelease:
        description: "Mark release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(python3 -c 'import json; print(json.load(open("v.json"))["version"].strip().lstrip("vV"))')"
            if [ -z "$VERSION" ]; then
              echo "Could not determine version from v.json" >&2
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare & verify release keystore
        env:
          ORBIT_MUSIC_KEYSTORE_BASE64: ${{ secrets.ORBIT_MUSIC_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_MUSIC_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ORBIT_MUSIC_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ORBIT_MUSIC_KEY_PASSWORD }}
          AUTO_SECRET_TOKEN: ${{ secrets.GH_PAT || secrets.REPO_PAT || secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$ORBIT_MUSIC_KEYSTORE_BASE64" ]; then
            if [ -z "$SECRET_KEYSTORE_PASSWORD" ]; then
              echo "::error::ORBIT_MUSIC_KEYSTORE_PASSWORD secret is missing." >&2
              exit 1
            fi

            printf '%s' "$ORBIT_MUSIC_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release.keystore
            if [ ! -s release.keystore ]; then
              echo "::error::Decoded release.keystore is empty. Check ORBIT_MUSIC_KEYSTORE_BASE64." >&2
              exit 1
            fi

            KEY_PASS="${SECRET_KEY_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
            ALIAS="${SECRET_KEY_ALIAS:-}"

            if [ -z "$ALIAS" ]; then
              if keytool -list -keystore release.keystore -storepass "$SECRET_KEYSTORE_PASSWORD" -alias orbitmusic >/dev/null 2>&1; then
                ALIAS="orbitmusic"
              else
                ALIAS="$(keytool -list -keystore release.keystore -storepass "$SECRET_KEYSTORE_PASSWORD" \
                  | awk -F',' '/PrivateKeyEntry|KeyEntry/ { print $1; exit }' | xargs)"
              fi
            fi

            if [ -z "$ALIAS" ]; then
              echo "::error::Could not determine key alias in release.keystore. Set ORBIT_MUSIC_KEY_ALIAS." >&2
              exit 1
            fi

            keytool -list -v -keystore release.keystore -storepass "$SECRET_KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null
            STORE_PASS="$SECRET_KEYSTORE_PASSWORD"
          elif [ -n "$AUTO_SECRET_TOKEN" ]; then
            echo "First run detected: generating persistent release keystore and saving it to GitHub Secrets..."
            STORE_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 28)"
            KEY_PASS="$STORE_PASS"
            ALIAS="orbitmusic"

            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -storepass "$STORE_PASS" \
              -alias "$ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Orbit Music,O=Orbit Music"

            KEYSTORE_B64="$(base64 -w 0 release.keystore)"

            export GH_TOKEN="$AUTO_SECRET_TOKEN"
            printf '%s' "$KEYSTORE_B64" | gh secret set ORBIT_MUSIC_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
            printf '%s' "$STORE_PASS" | gh secret set ORBIT_MUSIC_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
            printf '%s' "$ALIAS" | gh secret set ORBIT_MUSIC_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
            printf '%s' "$KEY_PASS" | gh secret set ORBIT_MUSIC_KEY_PASSWORD --repo "$GITHUB_REPOSITORY"
            echo "Saved generated keystore to repository Secrets. Future releases will reuse this exact signing key."
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Release Keystore Required
          No release keystore was found in repository Secrets (`ORBIT_MUSIC_KEYSTORE_BASE64`).
          GitHub's default `GITHUB_TOKEN` cannot write repository Secrets, so a generated keystore cannot persist across tag releases without a token or secret.

          **Option A — Auto-generate on first run (recommended):**
          1. Create a Fine-Grained Personal Access Token with **Secrets: Read and write** on this repository.
          2. Add it as repository secret **`GH_PAT`**.
          3. Re-run this workflow — it will generate `release.keystore` once, save it to repository Secrets automatically, and reuse it on every release forever.

          **Option B — Upload your existing keystore:**
          Add `ORBIT_MUSIC_KEYSTORE_BASE64`, `ORBIT_MUSIC_KEYSTORE_PASSWORD`, `ORBIT_MUSIC_KEY_ALIAS`, and `ORBIT_MUSIC_KEY_PASSWORD` in **Settings → Secrets and variables → Actions**.
          EOF
            echo "::error::Missing ORBIT_MUSIC_KEYSTORE_BASE64 (or GH_PAT to auto-generate and save the keystore on first run). Refusing to sign a release with an ephemeral key." >&2
            exit 1
          fi

          # Also ensure debug.keystore exists for unit test tasks if needed.
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          echo "ORBIT_MUSIC_KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
          echo "ORBIT_MUSIC_KEYSTORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "ORBIT_MUSIC_KEY_ALIAS=${ALIAS}" >> "$GITHUB_ENV"
          echo "ORBIT_MUSIC_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure app secrets from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          : > .env
          if [ -n "${GEMINI_API_KEY}" ]; then
            printf 'GEMINI_API_KEY=%s\n' "${GEMINI_API_KEY}" >> .env
          else
            echo "::warning::GitHub Secret not set for GEMINI_API_KEY. Falling back to .env.example placeholder in release APK."
          fi

      - name: Run unit tests
        run: ./gradlew :core:model:test :ytmusic:test :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Porbitmusic.version="${{ steps.meta.outputs.version }}" --no-daemon

      - name: Verify release APK signature
        id: verify
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Signed release APK not found (unsigned APKs cannot be published)." >&2
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME/build-tools." >&2
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          echo "$CERT_OUTPUT"

          if printf '%s' "$CERT_OUTPUT" | grep -q 'CN=Android Debug'; then
            echo "::error::Release APK is signed with a debug certificate! Refusing to publish." >&2
            exit 1
          fi

          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print $2; exit }')"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Package release APK & prepare release notes
        id: pkg
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APK_PATH="${{ steps.verify.outputs.apk_path }}"
          CERT_SHA256="${{ steps.verify.outputs.cert_sha256 }}"
          mkdir -p dist
          ASSET_NAME="Orbit-Music-${TAG}.apk"
          cp "$APK_PATH" "dist/${ASSET_NAME}"
          (cd dist && sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256")
          SHA256="$(cut -d ' ' -f 1 "dist/${ASSET_NAME}.sha256")"
          SIZE_BYTES="$(wc -c < "dist/${ASSET_NAME}")"
          SIZE_MB="$(awk "BEGIN { printf \"%.1f MB\", ${SIZE_BYTES} / 1048576 }")"

          NOTES_FILE="docs/releases/${TAG}.md"
          BODY_FILE="dist/release-notes.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" "$BODY_FILE"
          else
            printf '**Orbit Music %s** built automatically by GitHub Actions.\n' "${TAG#v}" > "$BODY_FILE"
          fi

          {
            printf '\n---\n'
            printf -- '- **APK:** `%s` (%s)\n' "${ASSET_NAME}" "${SIZE_MB}"
            printf -- '- **SHA-256:** `%s`\n' "${SHA256}"
            if [ -n "$CERT_SHA256" ]; then
              printf -- '- **Signing Cert SHA-256:** `%s`\n' "${CERT_SHA256}"
            fi
          } >> "$BODY_FILE"

          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset_name }}
          path: |
            dist/${{ steps.pkg.outputs.asset_name }}
            dist/${{ steps.pkg.outputs.asset_name }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Orbit Music ${{ steps.meta.outputs.tag }}
          body_path: dist/release-notes.md
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/${{ steps.pkg.outputs.asset_name }}
            dist/${{ steps.pkg.outputs.asset_name }}.sha256

  notify_discord:
    name: Notify Discord
    needs: release
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
